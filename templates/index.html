<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faceless Video Generator</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 700px; margin: auto; }
        h1 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; }
        textarea, input[type="file"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { display: block; width: 100%; background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        button:hover { background-color: #0056b3; }
        #videoPlayerContainer { margin-top: 20px; border: 1px solid #ddd; min-height: 360px; display: flex; align-items: center; justify-content: center; background-color: #eee; border-radius: 4px; }
        video { max-width: 100%; border-radius: 4px; }
        .message { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; }
        .loading { background-color: #e7f3fe; border-left: 6px solid #2196F3; color: #1c72c0;}
        .error { background-color: #ffebee; border-left: 6px solid #f44336; color: #c62828;}
        .success { background-color: #e8f5e9; border-left: 6px solid #4CAF50; color: #2e7d32;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Faceless Video Generator</h1>

        <form id="videoForm">
            <label for="script">Enter your script:</label>
            <textarea id="script" name="script" rows="10" required></textarea>

            <label for="audioFile">Upload audio file (optional, overrides script for audio):</label>
            <input type="file" id="audioFile" name="audioFile" accept="audio/*">

            <button type="submit" id="generateVideoBtn">Generate Video</button>
        </form>

        <div id="messageArea"></div>
        <div id="videoPlayerContainer">
            <p>Your generated video will appear here.</p>
        </div>
    </div>

    <script>
        const videoForm = document.getElementById('videoForm');
        const generateVideoBtn = document.getElementById('generateVideoBtn');
        const videoPlayerContainer = document.getElementById('videoPlayerContainer');
        const messageArea = document.getElementById('messageArea');

        videoForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            // Clear previous messages and video
            messageArea.innerHTML = '';
            messageArea.className = 'message'; // Reset class
            videoPlayerContainer.innerHTML = '<p>Generating video... please wait.</p>';
            generateVideoBtn.disabled = true; // Disable button during processing


            // Show loading message
            messageArea.className = 'message loading';
            messageArea.textContent = 'Processing your request... This might take a moment.';

            const formData = new FormData(videoForm);

            // Basic client-side validation: ensure script is not empty if no audio file.
            const scriptContent = formData.get('script').trim();
            const audioFileContent = formData.get('audioFile');

            if (!scriptContent && (!audioFileContent || audioFileContent.size === 0)) {
                 messageArea.className = 'message error';
                 messageArea.textContent = 'Please provide a script or an audio file.';
                 videoPlayerContainer.innerHTML = '<p>Video generation requires input.</p>';
                 generateVideoBtn.disabled = false;
                 return;
            }

            try {
                const response = await fetch('/generate_video', {
                    method: 'POST',
                    body: formData
                });

                generateVideoBtn.disabled = false; // Re-enable button

                if (response.ok) {
                    const blob = await response.blob();
                    if (blob.type === "video/mp4") {
                        const videoUrl = URL.createObjectURL(blob);

                        videoPlayerContainer.innerHTML = ''; // Clear loading message
                        const videoElement = document.createElement('video');
                        videoElement.src = videoUrl;
                        videoElement.controls = true;
                        videoElement.width = 640;
                        videoElement.height = 480;
                        videoPlayerContainer.appendChild(videoElement);

                        messageArea.className = 'message success';
                        messageArea.textContent = 'Video generated successfully!';
                    } else {
                        // If the response is OK but not a video, it might be an error message from the server
                        // that wasn't caught as a non-200 response (e.g. a 200 OK with an error payload).
                        // This part tries to read it as text.
                        const errorText = await blob.text(); // Try to read blob as text
                        console.error('Received non-video successful response:', errorText);
                        videoPlayerContainer.innerHTML = '<p>Could not load video. Unexpected response.</p>';
                        messageArea.className = 'message error';
                        messageArea.textContent = 'Unexpected server response: ' + errorText;
                    }

                } else {
                    const errorText = await response.text();
                    console.error('Error generating video:', errorText);
                    videoPlayerContainer.innerHTML = '<p>Could not load video.</p>';
                    messageArea.className = 'message error';
                    messageArea.textContent = 'Error generating video: ' + errorText;
                }
            } catch (error) {
                generateVideoBtn.disabled = false; // Re-enable button
                console.error('Network or other error:', error);
                videoPlayerContainer.innerHTML = '<p>Could not load video due to a network or client-side error.</p>';
                messageArea.className = 'message error';
                messageArea.textContent = 'An error occurred: ' + error.message;
            }
        });
    </script>
</body>
</html>
